# NEXUS CI. Not yet executed on GitHub from this repository; run it once to confirm.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Allow unprivileged user namespaces (needed by the command sandbox and its tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          NEXUS_ENV: test
